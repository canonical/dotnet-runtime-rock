summary: test the 'my-rock-name' project

execute: |
  case "$(uname -m)" in
    x86_64) rid="linux-x64" ;;
    aarch64) rid="linux-arm64" ;;
    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
  esac

  docker run --rm -v $(pwd):/app ubuntu:25.04 bash -c 'apt update && apt install dotnet-sdk-9.0 -y; for test_dir in "app_helloworld" "app_https-client"; do cd /app/${test_dir}/src && dotnet publish --no-self-contained -r '"$rid"'; done'

  for test_dir in "app_helloworld" "app_https-client"; do
    docker run --rm -v $(pwd)/${test_dir}/src:/app:ro -e PEBBLE_VERBOSE=1 my-rock-name exec /usr/bin/dotnet "/app/bin/Release/net9.0/$rid/Hello.dll"
  done
